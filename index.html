<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixoery | Super Advanced Wallpaper & Video Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Advanced UI Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 30px 20px;
            background: radial-gradient(circle at top, #1e293b 0%, #080c14 70%);
            border-bottom: 1px solid #1e293b;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #06b6d4, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 12px;
            background: rgba(30, 41, 59, 0.7);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #06b6d4, #6366f1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }

        /* Filter Switcher Tabs */
        .filter-tabs {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 20px;
            background-color: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #334155;
            transition: all 0.2s;
        }

        .tab.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        /* Layout Grid */
        .container {
            max-width: 1600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-gap: 30px;
            grid-auto-rows: 10px;
        }

        .card {
            background-color: #111827;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            grid-row-end: span 28;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1e293b;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #6366f1;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.2);
        }

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Media Badge (Video vs Image) */
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        /* Hover Overlay controls */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(8,12,20,0.95) 0%, rgba(8,12,20,0.4) 70%, transparent 100%);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .card:hover .overlay {
            opacity: 1;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .author {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .btn-edit {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .btn-edit:hover { background: #334155; }

        .btn-dl {
            background: #6366f1;
            color: white;
        }

        .btn-dl:hover { background: #4f46e5; }

        /* Super Advance Real-time Editing Engine Modal */
        .editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 20, 0.9);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .editor-content {
            background: #111827;
            border-radius: 24px;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .editor-content { grid-template-columns: 1fr; }
        }

        .preview-area {
            background: #090d16;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 500px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .control-panel {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .control-panel h2 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .control-panel p {
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-cancel { background: #1e293b; color: white; }
        .btn-save { background: linear-gradient(45deg, #06b6d4, #6366f1); color: white; }

        .loader {
            text-align: center;
            padding: 50px;
            color: #6366f1;
            font-size: 1.2rem;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>PIXOERY</h1>
        <p>Advanced Real-time Workspace, Live Wallpaper & Video Studio</p>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search modern themes (e.g., Cyberpunk, Anime, Abstract, Nature)..." value="Cyberpunk">
            <button id="search-btn">Search Treasury</button>
        </div>
        <div class="filter-tabs">
            <div class="tab active" onclick="switchMode('all')">All Content</div>
            <div class="tab" onclick="switchMode('desktop')">4K Desktop</div>
            <div class="tab" onclick="switchMode('portrait')">Mobile Only</div>
            <div class="tab" onclick="switchMode('video')">🎬 Live Video Engine</div>
        </div>
    </header>

    <main class="container">
        <div class="grid" id="wallpaper-grid"></div>
        <div class="loader" id="loader">Configuring high-fidelity architecture...</div>
    </main>

    <div class="editor-modal" id="editor-modal">
        <div class="editor-content">
            <div class="preview-area">
                <img id="editor-preview-img" src="" alt="Live Preview">
            </div>
            <div class="control-panel">
                <h2>Pixoery Studio Tools</h2>
                <p>Modify high-definition rendering settings in real-time</p>
                
                <div class="slider-group">
                    <label>Brightness <span id="val-bright">100%</span></label>
                    <input type="range" id="slider-bright" min="50" max="150" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Contrast <span id="val-contrast">100%</span></label>
                    <input type="range" id="slider-contrast" min="50" max="150" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Saturation <span id="val-saturate">100%</span></label>
                    <input type="range" id="slider-saturate" min="0" max="200" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Blur Depth <span id="val-blur">0px</span></label>
                    <input type="range" id="slider-blur" min="0" max="10" value="0" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Hue Shift <span id="val-hue">0°</span></label>
                    <input type="range" id="slider-hue" min="0" max="360" value="0" oninput="applyFilters()">
                </div>

                <div class="editor-actions">
                    <button class="action-btn btn-cancel" onclick="closeEditor()">Exit Studio</button>
                    <button class="action-btn btn-save" onclick="downloadEditedImage()">Download Master</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Integrated and Authorized securely with your premium access token
        const API_KEY = 'jvE1PTVglNqzoofmFNQAl0TxTQ8JP8e5LwdlruMp77BeKmd8J2DACpbf'; 
        
        const grid = document.getElementById('wallpaper-grid');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const loader = document.getElementById('loader');

        let currentPage = 1;
        let currentQuery = 'Cyberpunk';
        let isLoading = false;
        let currentMode = 'all'; // all, desktop, portrait, video
        let activeDownloadUrl = '';

        async function fetchBundle(query, page, isNewSearch = false) {
            if (isLoading) return;
            isLoading = true;
            loader.style.display = 'block';

            let url = '';
            
            // Advanced Routing logic depending on whether user clicks Images or Videos bundle
            if (currentMode === 'video') {
                url = `https://api.pexels.com/videos/search?query=${encodeURIComponent(query)}&per_page=18&page=${page}`;
            } else {
                let orientationParam = '';
                if (currentMode === 'desktop') orientationParam = '&orientation=landscape';
                if (currentMode === 'portrait') orientationParam = '&orientation=portrait';
                url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=20&page=${page}${orientationParam}`;
            }

            try {
                const response = await fetch(url, { headers: { Authorization: API_KEY } });
                const data = await response.json();
                if (isNewSearch) grid.innerHTML = '';
                
                if (currentMode === 'video') {
                    displayVideos(data.videos);
                } else {
                    displayImages(data.photos);
                }
            } catch (error) {
                console.error("Transmission error tracking down data blocks:", error);
            } finally {
                isLoading = false;
                loader.style.display = 'none';
            }
        }

        function displayImages(photos) {
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.classList.add('card');
                const randomSpan = Math.floor(Math.random() * 12) + 24; 
                card.style.gridRowEnd = `span ${randomSpan}`;

                card.innerHTML = `
                    <div class="badge">4K IMAGE</div>
                    <img src="${photo.src.large2x}" alt="${photo.alt}" loading="lazy">
                    <div class="overlay">
                        <div class="meta-info">
                            <span class="author">📷 ${photo.photographer}</span>
                        </div>
                        <div class="action-btns">
                            <button class="action-btn btn-edit" onclick="openEditor('${photo.src.large2x}', '${photo.src.original}')">Studio Edit</button>
                            <a href="${photo.src.original}" target="_blank" class="action-btn btn-dl">Download</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function displayVideos(videos) {
            videos.forEach(video => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.style.gridRowEnd = `span 26`; // Videos get beautiful uniform structural spacing

                // Select standard high-res landscape/portrait video file format link
                const videoFile = video.video_files.find(f => f.quality === 'hd') || video.video_files[0];

                card.innerHTML = `
                    <div class="badge" style="color: #d946ef;">LIVE VIDEO</div>
                    <video src="${videoFile.link}" loop muted autoplay playsinline></video>
                    <div class="overlay">
                        <div class="meta-info">
                            <span class="author">🎬 By ${video.user.name}</span>
                        </div>
                        <div class="action-btns">
                            <a href="${videoFile.link}" target="_blank" download class="action-btn btn-dl" style="background: #d946ef;">Download Video</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            currentPage = 1;
            fetchBundle(currentQuery, currentPage, true);
        }

        function handleSearch() {
            const query = searchInput.value.trim();
            if (query) {
                currentQuery = query;
                currentPage = 1;
                fetchBundle(currentQuery, currentPage, true);
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900) {
                currentPage++;
                fetchBundle(currentQuery, currentPage);
            }
        });

        /* --- ADVANCED CORE ENGINE: REALTIME IMAGE MODIFICATION STUDIO --- */
        function openEditor(previewUrl, originalUrl) {
            activeDownloadUrl = originalUrl;
            const img = document.getElementById('editor-preview-img');
            img.src = previewUrl;
            
            // Reset Studio Values
            document.getElementById('slider-bright').value = 100;
            document.getElementById('slider-contrast').value = 100;
            document.getElementById('slider-saturate').value = 100;
            document.getElementById('slider-blur').value = 0;
            document.getElementById('slider-hue').value = 0;
            applyFilters();

            document.getElementById('editor-modal').style.display = 'flex';
        }

        function closeEditor() {
            document.getElementById('editor-modal').style.display = 'none';
        }

        function applyFilters() {
            const b = document.getElementById('slider-bright').value;
            const c = document.getElementById('slider-contrast').value;
            const s = document.getElementById('slider-saturate').value;
            const bl = document.getElementById('slider-blur').value;
            const h = document.getElementById('slider-hue').value;

            document.getElementById('val-bright').innerText = `${b}%`;
            document.getElementById('val-contrast').innerText = `${c}%`;
            document.getElementById('val-saturate').innerText = `${s}%`;
            document.getElementById('val-blur').innerText = `${bl}px`;
            document.getElementById('val-hue').innerText = `${h}°`;

            const img = document.getElementById('editor-preview-img');
            img.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px) hue-rotate(${h}deg)`;
        }

        function downloadEditedImage() {
            // Generates raw link schema instruction for advanced edited output
            alert("To capture your custom layout filter parameters, download the full master resolution file opening in the next screen, or right-click to save your exact setup!");
            window.open(activeDownloadUrl, '_blank');
        }

        // Initialize Engine
        fetchBundle(currentQuery, currentPage);
    </script>
</body>
</html>
