<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pixoE | Advanced Wallpaper & Video Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Fully Responsive Header Layout */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px 25px 15px;
            background: radial-gradient(circle at top, #1e293b 0%, #080c14 70%);
            border-bottom: 1px solid #1e293b;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #06b6d4, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            padding: 0 10px;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 8px;
            background: rgba(30, 41, 59, 0.7);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: white;
            font-size: 0.95rem;
            outline: none;
            min-width: 0; /* Prevents input blowout on small mobile */
        }

        button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #06b6d4, #6366f1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        /* Scrollable Category Tabs for Small Screens */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            max-width: 100%;
            overflow-x: auto;
            padding: 5px 10px;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }

        .filter-tabs::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background-color: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #334155;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        /* Adaptive Grid Engine */
        .container {
            max-width: 1600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 20px;
            grid-auto-rows: 10px;
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }
        }

        .card {
            background-color: #111827;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            grid-row-end: span 28;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #1e293b;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #6366f1;
            transform: translateY(-4px);
        }

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        /* Responsive Persistent/Hover Overlay Engine */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(8,12,20,1) 0%, rgba(8,12,20,0.4) 80%, transparent 100%);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Keep panel visibly interactable instantly for touch screens */
        @media (max-width: 1024px) {
            .overlay { opacity: 1; background: linear-gradient(to top, rgba(8,12,20,1) 0%, rgba(8,12,20,0.6) 100%); }
        }

        .card:hover .overlay {
            opacity: 1;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .author {
            font-size: 0.8rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-edit { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        .btn-dl { background: #6366f1; color: white; }

        /* FIXED STICKY MOBILE-FIRST EDITOR ENGINE MODAL */
        .editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }

        .editor-content {
            background: #111827;
            border-radius: 20px;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Stack layout on Mobile so elements do not overlap or hide */
        @media (max-width: 768px) {
            .editor-content {
                grid-template-columns: 1fr;
                max-height: 95vh;
            }
        }

        .preview-area {
            background: #090d16;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            max-height: 350px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .control-panel {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .control-panel h2 { font-size: 1.3rem; margin-bottom: 4px; }
        .control-panel p { margin-bottom: 20px; font-size: 0.85rem; color: #94a3b8; }

        .slider-group {
            margin-bottom: 15px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .editor-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-cancel { background: #1e293b; color: white; }
        .btn-save { background: linear-gradient(45deg, #06b6d4, #6366f1); color: white; }

        .loader {
            text-align: center;
            padding: 40px;
            color: #6366f1;
            font-size: 1.1rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>pixoE</h1>
        <p>Advanced Live Wallpaper & Motion Video Studio Workspace</p>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search parameters (e.g., Cyberpunk, Neon, Minimal)..." value="Neon Cyberpunk">
            <button id="search-btn">Search</button>
        </div>
        <div class="filter-tabs">
            <div class="tab active" onclick="switchMode('all')">All Engine Art</div>
            <div class="tab" onclick="switchMode('desktop')">4K Desktop</div>
            <div class="tab" onclick="switchMode('portrait')">Mobile Displays</div>
            <div class="tab" onclick="switchMode('video')">🎬 Live Motion Loops</div>
        </div>
    </header>

    <main class="container">
        <div class="grid" id="wallpaper-grid"></div>
        <div class="loader" id="loader">Syncing visual parameters...</div>
    </main>

    <div class="editor-modal" id="editor-modal">
        <div class="editor-content">
            <div class="preview-area">
                <img id="editor-preview-img" src="" alt="Live System Filter Sync">
            </div>
            <div class="control-panel">
                <h2>pixoE Digital Studio</h2>
                <p>Modify structural parameters before compiling</p>
                
                <div class="slider-group">
                    <label>Brightness <span id="val-bright">100%</span></label>
                    <input type="range" id="slider-bright" min="50" max="150" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Contrast <span id="val-contrast">100%</span></label>
                    <input type="range" id="slider-contrast" min="50" max="150" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Saturation <span id="val-saturate">100%</span></label>
                    <input type="range" id="slider-saturate" min="0" max="200" value="100" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Blur Depth <span id="val-blur">0px</span></label>
                    <input type="range" id="slider-blur" min="0" max="10" value="0" oninput="applyFilters()">
                </div>
                <div class="slider-group">
                    <label>Hue Matrix Shift <span id="val-hue">0°</span></label>
                    <input type="range" id="slider-hue" min="0" max="360" value="0" oninput="applyFilters()">
                </div>

                <div class="editor-actions">
                    <button class="action-btn btn-cancel" onclick="closeEditor()">Close Studio</button>
                    <button class="action-btn btn-save" onclick="downloadEditedImage()">Source Download</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'jvE1PTVglNqzoofmFNQAl0TxTQ8JP8e5LwdlruMp77BeKmd8J2DACpbf'; 
        
        const grid = document.getElementById('wallpaper-grid');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const loader = document.getElementById('loader');

        let currentPage = 1;
        let currentQuery = 'Neon Cyberpunk';
        let isLoading = false;
        let currentMode = 'all'; 
        let activeDownloadUrl = '';

        async function fetchBundle(query, page, isNewSearch = false) {
            if (isLoading) return;
            isLoading = true;
            loader.style.display = 'block';

            let url = '';
            if (currentMode === 'video') {
                url = `https://api.pexels.com/videos/search?query=${encodeURIComponent(query)}&per_page=16&page=${page}`;
            } else {
                let orientationParam = '';
                if (currentMode === 'desktop') orientationParam = '&orientation=landscape';
                if (currentMode === 'portrait') orientationParam = '&orientation=portrait';
                url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=18&page=${page}${orientationParam}`;
            }

            try {
                const response = await fetch(url, { headers: { Authorization: API_KEY } });
                const data = await response.json();
                if (isNewSearch) grid.innerHTML = '';
                
                if (currentMode === 'video') {
                    displayVideos(data.videos);
                } else {
                    displayImages(data.photos);
                }
            } catch (error) {
                console.error("Transmission breakdown:", error);
            } finally {
                isLoading = false;
                loader.style.display = 'none';
            }
        }

        function displayImages(photos) {
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.classList.add('card');
                const randomSpan = Math.floor(Math.random() * 10) + 24; 
                card.style.gridRowEnd = `span ${randomSpan}`;

                card.innerHTML = `
                    <div class="badge">4K MASTER</div>
                    <img src="${photo.src.large2x}" alt="${photo.alt}" loading="lazy">
                    <div class="overlay">
                        <div class="meta-info">
                            <span class="author">📷 ${photo.photographer}</span>
                        </div>
                        <div class="action-btns">
                            <button class="action-btn btn-edit" onclick="openEditor('${photo.src.large2x}', '${photo.src.original}')">Studio Edit</button>
                            <a href="${photo.src.original}" target="_blank" class="action-btn btn-dl">Download</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function displayVideos(videos) {
            videos.forEach(video => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.style.gridRowEnd = `span 26`; 

                const videoFile = video.video_files.find(f => f.quality === 'hd') || video.video_files[0];

                card.innerHTML = `
                    <div class="badge" style="color: #d946ef;">MOTION LOOP</div>
                    <video src="${videoFile.link}" loop muted autoplay playsinline></video>
                    <div class="overlay">
                        <div class="meta-info">
                            <span class="author">🎬 ${video.user.name}</span>
                        </div>
                        <div class="action-btns">
                            <a href="${videoFile.link}" target="_blank" download class="action-btn btn-dl" style="background: #d946ef;">Get Video</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');
            currentPage = 1;
            fetchBundle(currentQuery, currentPage, true);
        }

        function handleSearch() {
            const query = searchInput.value.trim();
            if (query) {
                currentQuery = query;
                currentPage = 1;
                fetchBundle(currentQuery, currentPage, true);
            }
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900) {
                currentPage++;
                fetchBundle(currentQuery, currentPage);
            }
        });

        function openEditor(previewUrl, originalUrl) {
            activeDownloadUrl = originalUrl;
            const img = document.getElementById('editor-preview-img');
            img.src = previewUrl;
            
            document.getElementById('slider-bright').value = 100;
            document.getElementById('slider-contrast').value = 100;
            document.getElementById('slider-saturate').value = 100;
            document.getElementById('slider-blur').value = 0;
            document.getElementById('slider-hue').value = 0;
            applyFilters();

            document.getElementById('editor-modal').style.display = 'flex';
        }

        function closeEditor() {
            document.getElementById('editor-modal').style.display = 'none';
        }

        function applyFilters() {
            const b = document.getElementById('slider-bright').value;
            const c = document.getElementById('slider-contrast').value;
            const s = document.getElementById('slider-saturate').value;
            const bl = document.getElementById('slider-blur').value;
            const h = document.getElementById('slider-hue').value;

            document.getElementById('val-bright').innerText = `${b}%`;
            document.getElementById('val-contrast').innerText = `${c}%`;
            document.getElementById('val-saturate').innerText = `${s}%`;
            document.getElementById('val-blur').innerText = `${bl}px`;
            document.getElementById('val-hue').innerText = `${h}°`;

            const img = document.getElementById('editor-preview-img');
            img.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px) hue-rotate(${h}deg)`;
        }

        function downloadEditedImage() {
            alert("To extract with active filters, right-click and save your configuration from the master tab open.");
            window.open(activeDownloadUrl, '_blank');
        }

        fetchBundle(currentQuery, currentPage);
    </script>
</body>
</html>
